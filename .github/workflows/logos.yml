name: Populate company logos
on:
  push:
    paths: [refresh_logos.py, .github/workflows/logos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow yfinance
      - run: python refresh_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_logos.json
          if ! git diff --cached --quiet; then
            git commit -m "Store company logo library"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
