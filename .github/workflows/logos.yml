name: Populate company logos
on:
  push:
    paths: [refresh_logos.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow yfinance
      - run: python refresh_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company_logos.json
          git diff --cached --quiet || (git commit -m "Store company logo library" && git push)
