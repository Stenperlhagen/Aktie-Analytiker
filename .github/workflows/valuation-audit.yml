name: EquityLab full valuation audit
on:
  push:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - '.github/workflows/valuation-audit.yml'
  pull_request:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - '.github/workflows/valuation-audit.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: valuation-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  provider-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pypdf
      - name: Inspect live fields for representative listings
        if: ${{ github.event.repository.private == true }}
        env:
          BORSAPI_API_KEY: ${{ secrets.BORSAPI_API_KEY }}
        run: |
          if [ -n "$BORSAPI_API_KEY" ]; then
            python valuation_audit.py --live --probe
          else
            echo '::error::Live provider probe requires BORSAPI_API_KEY.'
            exit 1
          fi
  audit:
    needs: provider-probe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pypdf
      - run: python valuation_audit.py
      - name: Public repository only runs mathematical checks
        if: ${{ github.event.repository.private != true }}
        run: echo '::notice::Live licensed data is not tested in public CI.'
      - name: Check live coverage when configured
        if: ${{ github.event.repository.private == true }}
        env:
          BORSAPI_API_KEY: ${{ secrets.BORSAPI_API_KEY }}
        run: |
          if [ -n "$BORSAPI_API_KEY" ]; then
            python valuation_audit.py --live
          else
            echo '::error::Live coverage requires BORSAPI_API_KEY.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event.repository.private == true }}
        with:
          name: valuation-audit
          path: valuation-audit.csv
