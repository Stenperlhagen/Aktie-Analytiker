name: EquityLab full valuation audit
on:
  push:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - '.github/workflows/valuation-audit.yml'
  pull_request:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - '.github/workflows/valuation-audit.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pypdf
      - run: python valuation_audit.py
      - name: Check live coverage when configured
        env:
          BORSAPI_API_KEY: ${{ secrets.BORSAPI_API_KEY }}
        run: |
          if [ -n "$BORSAPI_API_KEY" ]; then
            python valuation_audit.py --live
          else
            echo '::notice::Live coverage skipped because BORSAPI_API_KEY is unavailable.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valuation-audit
          path: valuation-audit.csv
