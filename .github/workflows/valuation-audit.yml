name: EquityLab full valuation audit
on:
  push:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - 'tests/test_quality.py'
      - 'avanza-registry.json'
      - '.github/workflows/valuation-audit.yml'
  pull_request:
    paths:
      - 'valuation_audit.py'
      - 'app.py'
      - 'tests/test_quality.py'
      - '.github/workflows/valuation-audit.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: valuation-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  provider-probe:
    # Fork pull requests cannot access the repository's API secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pypdf yfinance
      - name: Inspect live fields for representative listings
        env:
          BORSAPI_API_KEY: ${{ secrets.BORSAPI_API_KEY }}
        run: |
          if [ -n "$BORSAPI_API_KEY" ]; then
            python valuation_audit.py --live --probe
          else
            echo '::error::Authenticated provider probe requires BORSAPI_API_KEY.'
            exit 2
          fi
  audit:
    needs: provider-probe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests pypdf yfinance
      - run: python -m unittest discover -s tests -p 'test_quality.py'
      - run: python valuation_audit.py
      - name: Check live coverage when configured
        env:
          BORSAPI_API_KEY: ${{ secrets.BORSAPI_API_KEY }}
        run: |
          if [ -n "$BORSAPI_API_KEY" ]; then
            python valuation_audit.py --live
          else
            echo '::error::Authenticated coverage requires BORSAPI_API_KEY.'
            exit 2
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event.repository.private == true
        with:
          name: valuation-audit
          path: valuation-audit.csv
