name: EquityLab code checks
on:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/equitylab-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m py_compile app.py
      - name: Verify critical UI and data paths
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app.py').read_text(encoding='utf-8')
          checks = {
              'four tabs': "one,two,three,four=st.tabs(" in source,
              'news tab removed': "'Nyheter – 6 månader'" not in source,
              'competitor configuration': "PEER_UNIVERSE={" in source,
              'valuation categories': "def valuation_category(" in source,
              'reverse DCF': "Reverse DCF" in source,
              'free data fallback': "annual_income=obj.income_stmt" in source,
              'valuation screener': "def screener_snapshot(symbol):" in source,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          assert all(checks.values())
          PY
