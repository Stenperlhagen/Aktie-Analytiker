name: EquityLab code checks
on:
  push:
    paths:
      - 'app.py'
      - 'test_app_smoke.py'
      - 'requirements.txt'
      - '.github/workflows/equitylab-checks.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'test_app_smoke.py'
      - 'requirements.txt'
      - '.github/workflows/equitylab-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m py_compile app.py
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Streamlit startup smoke test
        run: python -m unittest test_app_smoke.py
